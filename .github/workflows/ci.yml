# CI for the Robinson GitHub MCP. Independent jobs plus one aggregate job named `ci`, the single merge gate.
# Public repository: no secrets, read-only token, never pull_request_target, never echo environment values.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # secret scan, docs check, index validation, catalog count, lint, write-safety, token budgets, core imports
      - run: CI_TIMING_FILE=.ci-timing/phase.jsonl node scripts/ci-phase.mjs --budget-seconds 30 -- npm run check
      - name: Verify complete browser spec coverage
        run: node scripts/browser-shards.mjs --check
      - name: Retain CI duration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-check
          path: .ci-timing/phase.jsonl
          if-no-files-found: error
          retention-days: 14
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: CI_PHASE_LABEL=unit-${{ matrix.shard }} CI_TIMING_FILE=.ci-timing/phase.jsonl node scripts/ci-phase.mjs --budget-seconds 30 -- npm test -- --shard=${{ matrix.shard }}/3
      - name: Retain CI duration evidence
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-unit-${{ matrix.shard }}
          path: .ci-timing/phase.jsonl
          if-no-files-found: error
          retention-days: 14
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Docker Official Postgres 17: ECR public mirror returned repeated 429/data-limit errors before test startup on Oct 12, 2026.
        # Preserve the same PostgreSQL major and full DB suite; this is not a test skip.
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: CI_TIMING_FILE=.ci-timing/phase.jsonl node scripts/ci-phase.mjs --budget-seconds 30 -- npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
      - name: Retain CI duration evidence
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-db
          path: .ci-timing/phase.jsonl
          if-no-files-found: error
          retention-days: 14
  shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: CI_TIMING_FILE=.ci-timing/phase.jsonl node scripts/ci-phase.mjs --budget-seconds 30 -- npm run test:shapes
      - name: Retain CI duration evidence
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-shapes
          path: .ci-timing/phase.jsonl
          if-no-files-found: error
          retention-days: 14
  rtc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      # Upstream Hub RTC 1 runner pinned and executed against reference + our restricted HTTP adapter.
      # A deliberately non-certified manifest remains an explicit failed probe, never a pass.
      - if: steps.scope.outputs.code == 'true'
        run: CI_TIMING_FILE=.ci-timing/phase.jsonl node scripts/ci-phase.mjs --budget-seconds 30 -- npm run test:rtc
      - name: Retain CI duration evidence
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-rtc
          path: .ci-timing/phase.jsonl
          if-no-files-found: error
          retention-days: 14
  browser:
    name: browser (${{ matrix.shard }})
    # Real browsers (Chromium as an Android phone and desktop, WebKit as an iPhone) walk the whole sign-in and the
    # "My connection" page against the real server code, a fake GitHub and a fake app. No network service is contacted.
    runs-on: ubuntu-latest
    # Playwright's exact npm version image already contains Chromium, WebKit
    # and system libraries. Avoid network-limited apt/OS dependency installation
    # failures before any browser test executes.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    # Three minutes is a hard runner safety cap. Thirty seconds is a soft
    # execution target and passing overruns must not fail.
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [sign-in, home-page, fair-use]
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      # Browser engines and OS dependencies are baked into the pinned Playwright
      # CI image; REQUIRE_ALL_BROWSERS still makes missing engines fail the job.
      - if: steps.scope.outputs.code == 'true'
        run: CI_TIMING_FILE=.ci-timing/phase.jsonl node scripts/ci-phase.mjs --budget-seconds 30 -- node scripts/browser-shards.mjs ${{ matrix.shard }}
        env:
          # In a GitHub job container, the throwaway PostgreSQL service is
          # available on Docker's isolated "postgres" service hostname.
          # The CI-only password is not embedded in a connection URI.
          PGPASSWORD: ci-only-not-a-secret
          TEST_DATABASE_URL: postgresql://postgres@postgres:5432/postgres
          REQUIRE_ALL_BROWSERS: '1'
          CI_PHASE_LABEL: browser-${{ matrix.shard }}
      - name: Retain CI duration evidence
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-browser-${{ matrix.shard }}
          path: .ci-timing/phase.jsonl
          if-no-files-found: error
          retention-days: 14
  ci:
    if: always()
    needs: [check, unit, db, shapes, rtc, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db.result }}
          SHAPES: ${{ needs.shapes.result }}
          RTC: ${{ needs.rtc.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          status=0
          for job in CHECK UNIT DB SHAPES RTC BROWSER; do
            result="${!job}"
            echo "$job: $result"
            [ "$result" = success ] || status=1
          done
          exit $status
