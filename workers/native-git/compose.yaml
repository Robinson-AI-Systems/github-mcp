services:
  native-git:
    build:
      context: ../..
      dockerfile: workers/native-git/Dockerfile
      # SRV-STATUS-1: set SOURCE_COMMIT to the live commit being deployed so the worker reports it.
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    # Shared worker limits, not per-workspace reservations or dedicated cores.
    mem_limit: ${NATIVE_GIT_MEMORY_LIMIT:-2g}
    cpus: ${NATIVE_GIT_CPUS:-2.0}
    environment:
      PORT: "3000"
      NATIVE_GIT_STORAGE_ROOT: /data
      NATIVE_GIT_MIN_AVAILABLE_MEMORY_MB: ${NATIVE_GIT_MIN_AVAILABLE_MEMORY_MB:-32}
      NATIVE_GIT_MIN_AVAILABLE_DISK_MB: ${NATIVE_GIT_MIN_AVAILABLE_DISK_MB:-64}
      NATIVE_GIT_MAX_LOOP_DELAY_MS: ${NATIVE_GIT_MAX_LOOP_DELAY_MS:-250}
      NATIVE_GIT_CONTROL_PUBLIC_KEY: ${NATIVE_GIT_CONTROL_PUBLIC_KEY:?Pin the MCP public verification key from its native-git-key endpoint}
      # GIT-DIRECT-1 (optional): the worker's own git host. Both empty = off (the MCP domain keeps working).
      GIT_DIRECT_ORIGIN: ${GIT_DIRECT_ORIGIN:-}
      GIT_DIRECT_CONTROL_ORIGIN: ${GIT_DIRECT_CONTROL_ORIGIN:-}
      GIT_DIRECT_PORT: "3001"
    volumes:
      - native-git-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose: ["3000", "3001"]
volumes:
  native-git-data:
